<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arb Bot — Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&display=swap');

:root {
  --bg:       #080a0d;
  --surface:  #0d1117;
  --card:     #111620;
  --border:   #1c2333;
  --border2:  #263044;
  --text:     #cdd9f0;
  --muted:    #4a5878;
  --dim:      #2a3550;
  --green:    #23d18b;
  --green-bg: rgba(35,209,139,.08);
  --red:      #f14c4c;
  --red-bg:   rgba(241,76,76,.08);
  --amber:    #f0a500;
  --blue:     #4d9fff;
  --purple:   #a78bfa;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  padding: 0;
  /* Subtle grid texture */
  background-image:
    linear-gradient(rgba(77,159,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,159,255,.015) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ── TOPBAR ──────────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}

.brand {
  display: flex; align-items: center; gap: 10px;
}

.brand-mark {
  width: 28px; height: 28px;
  background: var(--green);
  border-radius: 6px;
  display: flex; align-items: center;
